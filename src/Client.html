<script>
(() => {
  const state = {
    mode: 'learning',
    current: null,
    selectedAnswer: '',
    sessionId: 'WEB-' + new Date().toISOString().replace(/\D/g, '').slice(0, 14) + '-' + Math.random().toString(36).slice(2, 8),
    startedAt: 0,
    excludeQuestionIds: [],
    presentSeq: 0,
    failedQuestions: new Set(),
    attemptId: '',
    aiSeq: 0,
    lightboxZoomed: false,
    // 結果を読んでいるあいだに用意しておく次の1問（読み取りだけ・書き込みはしない）
    prefetch: null,
    prefetchKey: '',
    // ジャンル別画面。表示するだけで、出題・採点・理解度には一切関わらない。
    genre: null,
    genreMistakes: null,
    genreOpen: new Set(),
    /*
     * 結果画面を読んでいるあいだに用意しておくAI解説。
     * status は 'loading' | 'done' | 'failed'。
     * 先読みの最中にボタンを押されても2回生成しないよう、ここで待ち合わせる。
     */
    aiPrefetch: null,
    aiWanted: false,
    aiShownAttemptId: ''
  };

  const $ = id => document.getElementById(id);

  document.addEventListener('DOMContentLoaded', () => {
    $('startBtn').addEventListener('click', () => startLearning('learning'));
    $('reviewBtn').addEventListener('click', () => startLearning('review'));
    $('unansweredBtn').addEventListener('click', () => startLearning('unanswered'));
    $('genreBtn').addEventListener('click', showGenreView);
    $('genreHomeBtn').addEventListener('click', showHome);
    $('genreMistakeBtn').addEventListener('click', loadGenreMistakes);
    $('homeBtn').addEventListener('click', showHome);
    $('resultHomeBtn').addEventListener('click', showHome);
    $('noticeHomeBtn').addEventListener('click', showHome);
    $('nextBtn').addEventListener('click', loadNextQuestion);
    $('submitBtn').addEventListener('click', submitCurrentAnswer);
    $('aiExplainBtn').addEventListener('click', () => {
      // 一度出したあとの押下は「もう一度作る」＝保存を使わず作り直す。
      requestAiExplanation(state.aiShownAttemptId === state.attemptId);
    });
    $('lightboxClose').addEventListener('click', closeLightbox);
    $('lightboxZoomBtn').addEventListener('click', toggleLightboxZoom);
    $('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLightbox(); });
    document.addEventListener('change', updateSubmitState);
    loadHomeData();
  });

  /*
   * ホームの表示は、読むシートごとに3つの呼び出しへ分けている。
   * 1つが遅くても残りは表示され、どこで待たされているかも画面から分かる。
   *
   *   getInitialData()        06_ダッシュボード + 00_設定
   *   getWeaknessData()       02_マインドマップ（理解度の数式が並ぶ重いシート）
   *   getUnansweredSummary()  03_問題台帳 + 04_学習ログ
   */
  function loadHomeData() {
    const waiting = startWaitingNotice('ruleLabel', '理解度を読み込み中...');

    google.script.run
      .withSuccessHandler(data => {
        waiting.stop();
        $('ruleLabel').textContent = data && data.ruleVersion
          ? '理解度基準: ' + data.ruleVersion
          : '理解度基準をシートから読み込み';
        renderDashboard((data && data.dashboard) || []);
      })
      .withFailureHandler(err => { waiting.stop(); showHomeError(err); })
      .getInitialData();

    // 02_マインドマップは理解度の数式が並ぶため、読むと再計算の完了を待つ。
    // 学習状況の表示を止めないよう、別の呼び出しにして後から差し込む。
    loadWeaknesses();

    // 残数の集計は03_問題台帳と04_学習ログを端から端まで読むため重い。
    // 理解度や弱点の表示を待たせないよう、別の呼び出しにして後から差し込む。
    loadUnansweredSummary();
  }

  function loadWeaknesses() {
    const waiting = startWaitingNotice('weaknessHint', '理解度が低い順');

    google.script.run
      .withSuccessHandler(items => {
        waiting.stop();
        $('weaknessHint').textContent = '理解度が低い順';
        renderWeaknesses(items || []);
      })
      .withFailureHandler(() => {
        waiting.stop();
        $('weaknessHint').textContent = '読み込めませんでした';
      })
      .getWeaknessData();
  }

  /*
   * 待たされていることを画面に出す。
   * 黙ったまま止まって見えると、遅いのか壊れたのかが分からない。
   */
  function startWaitingNotice(elementId, label) {
    const startedAt = Date.now();
    $(elementId).textContent = label;

    const timer = window.setInterval(() => {
      const seconds = Math.round((Date.now() - startedAt) / 1000);
      if (seconds < 8) return;
      $(elementId).textContent = label + '（' + seconds + '秒経過）';
    }, 1000);

    return { stop: () => window.clearInterval(timer) };
  }

  function loadUnansweredSummary() {
    $('unansweredBtn').textContent = '未回答問題を優先して解く（数えています…）';

    google.script.run
      .withSuccessHandler(renderUnansweredButton)
      .withFailureHandler(() => renderUnansweredButton(null))
      .getUnansweredSummary();
  }

  // 残数はサーバー（＝04_学習ログのcounts_for_mastery）が数えた値をそのまま出す。
  function renderUnansweredButton(summary) {
    const btn = $('unansweredBtn');
    const remaining = summary ? Number(summary.remaining) : NaN;

    if (!Number.isFinite(remaining)) {
      btn.textContent = '未回答問題を優先して解く';
      return;
    }
    btn.textContent = remaining > 0
      ? '未回答問題を優先して解く（' + remaining + '問）'
      : '未回答問題を優先して解く（すべて解答済み）';
  }

  // ホーム画面での失敗は、問題画面用の表示では見えない。ここで理由を残す。
  function showHomeError(err) {
    const msg = err && err.message ? err.message : String(err || '不明なエラー');
    $('ruleLabel').textContent = '学習状況を読み込めませんでした';
    showToast(msg);
  }

  function renderDashboard(items) {
    const grid = $('dashboardGrid');
    grid.innerHTML = '';
    const wanted = new Set(['論点着手率', '平均理解度', '問題消化率', '未回答verified問題数']);
    items.filter(x => wanted.has(x.label)).forEach(x => {
      const div = document.createElement('div');
      div.className = 'metric';
      const label = document.createElement('div');
      label.className = 'metric-label';
      label.textContent = x.label;
      const value = document.createElement('div');
      value.className = 'metric-value';
      value.textContent = x.value;
      div.append(label, value);
      grid.appendChild(div);
    });
  }

  function renderWeaknesses(items) {
    const list = $('weaknessList');
    list.innerHTML = '';
    items.forEach(x => {
      const row = document.createElement('div');
      row.className = 'weakness-item';

      const name = document.createElement('div');
      name.className = 'weakness-name';
      name.textContent = x.topic || x.node_id;

      const pct = document.createElement('div');
      pct.textContent = String(x.mastery_pct) + '%';

      const track = document.createElement('div');
      track.className = 'progress-track';
      const bar = document.createElement('div');
      bar.className = 'progress-bar';
      bar.style.width = Math.max(0, Math.min(100, Number(x.mastery_pct || 0))) + '%';
      track.appendChild(bar);

      row.append(name, pct, track);
      list.appendChild(row);
    });
  }

  /* ---------------------- ジャンル別の弱点（表示だけ） ----------------------
   *
   * 学習モードではないので MODES へは足さない。
   * getGenreBreakdown() は02_マインドマップだけを読む（getWeaknessData と同じ範囲）。
   * 「これまでに間違えた数」は押されたときだけ getGenreMistakeHistory() を呼ぶ。
   */
  function showGenreView() {
    clearPrefetch();
    state.current = null;
    $('homeView').classList.add('hidden');
    $('questionView').classList.add('hidden');
    $('genreView').classList.remove('hidden');
    loadGenreBreakdown();
  }

  /*
   * 1問解いたら、画面が持っているジャンル別の集計は古くなる。
   * 「これまでに間違えた数」はボタンを押して読み込むものなので、
   * ボタンの見た目も押す前の状態へ戻す。
   */
  function forgetGenreData() {
    state.genre = null;
    state.genreMistakes = null;
    const btn = $('genreMistakeBtn');
    btn.disabled = false;
    btn.classList.remove('hidden');
    btn.textContent = 'これまでに間違えた問題数も見る';
    $('genreMistakeNote').textContent =
      '帯グラフの「誤答」は、理解度と同じく最新の正式回答が不正解の問題数です。'
      + '一度間違えたあと復習で正解にできた問題は含みません。';
  }

  function loadGenreBreakdown() {
    const waiting = startWaitingNotice('genreHint', 'ジャンル別に集計中...');

    google.script.run
      .withSuccessHandler(data => {
        waiting.stop();
        state.genre = data || null;
        $('genreHint').textContent = data && data.totals
          ? '正答率が低い順（' + data.totals.topic_count + '論点）'
          : '正答率が低い順';
        renderGenreBreakdown();
      })
      .withFailureHandler(err => {
        waiting.stop();
        $('genreHint').textContent = '読み込めませんでした';
        showToast(err && err.message ? err.message : String(err || '不明なエラー'));
      })
      .getGenreBreakdown();
  }

  // 押されたときだけ04_学習ログを読む。初回表示を待たせないため。
  function loadGenreMistakes() {
    const btn = $('genreMistakeBtn');
    btn.disabled = true;
    btn.textContent = '学習ログを読んでいます...';

    google.script.run
      .withSuccessHandler(data => {
        state.genreMistakes = data || null;
        btn.classList.add('hidden');
        $('genreMistakeNote').innerHTML =
          '「これまでに間違えた」は、正式な回答で一度でも不正解になった問題の数です'
          + '（同じ問題を何度間違えても1問）。復習で正解にできた問題も含むため、'
          + '帯グラフの「誤答」より多くなります。';
        renderGenreBreakdown();
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = 'これまでに間違えた問題数も見る';
        showToast(err && err.message ? err.message : String(err || '不明なエラー'));
      })
      .getGenreMistakeHistory();
  }

  function renderGenreBreakdown() {
    const data = state.genre;
    const list = $('genreList');
    const totals = $('genreTotals');
    list.innerHTML = '';
    totals.innerHTML = '';
    if (!data || !Array.isArray(data.genres)) return;

    if (data.totals) {
      appendMetric(totals, '総問題数', String(data.totals.total) + '問');
      appendMetric(totals, '回答済み', data.totals.answered + '問（' + data.totals.answered_pct + '%）');
      appendMetric(totals, '未回答', data.totals.unanswered + '問');
      appendMetric(totals, '正答率', data.totals.correct_pct + '%');
    }

    data.genres.forEach(genre => list.appendChild(genreCard(genre)));
  }

  function appendMetric(parent, label, value) {
    const div = document.createElement('div');
    div.className = 'metric';
    const l = document.createElement('div');
    l.className = 'metric-label';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'metric-value';
    v.textContent = value;
    div.append(l, v);
    parent.appendChild(div);
  }

  function genreCard(genre) {
    const card = document.createElement('div');
    card.className = 'genre-card';

    const head = document.createElement('div');
    head.className = 'genre-head';
    const name = document.createElement('div');
    name.className = 'genre-name';
    name.textContent = genre.major_area;
    const rates = document.createElement('div');
    rates.className = 'genre-rates';
    rates.textContent = '回答率 ' + genre.answered_pct + '% ／ 正答率 ' + genre.correct_pct + '%';
    head.append(name, rates);

    card.append(head, genreBar(genre), genreNumbers(genre));

    const mistakes = genreEverWrong(genre);
    if (mistakes !== null) {
      const line = document.createElement('div');
      line.className = 'genre-numbers genre-mistakes';
      line.textContent = 'これまでに間違えた問題: ' + mistakes + '問';
      card.appendChild(line);
    }

    if (genre.topics && genre.topics.length) {
      const toggle = document.createElement('button');
      toggle.className = 'genre-toggle';
      toggle.type = 'button';
      const topics = document.createElement('div');
      topics.className = 'genre-topics';

      const paint = () => {
        const open = state.genreOpen.has(genre.major_area);
        toggle.textContent = (open ? '▲ 論点を隠す（' : '▼ 論点ごとに見る（') + genre.topics.length + '件）';
        topics.classList.toggle('hidden', !open);
      };
      toggle.addEventListener('click', () => {
        if (state.genreOpen.has(genre.major_area)) state.genreOpen.delete(genre.major_area);
        else state.genreOpen.add(genre.major_area);
        paint();
      });

      genre.topics.forEach(topic => topics.appendChild(genreTopicRow(topic)));
      paint();
      card.append(toggle, topics);
    }

    return card;
  }

  function genreTopicRow(topic) {
    const row = document.createElement('div');
    row.className = 'genre-topic';

    const head = document.createElement('div');
    head.className = 'genre-head';
    const name = document.createElement('div');
    name.className = 'genre-topic-name';
    name.textContent = topic.topic || topic.node_id;
    const rates = document.createElement('div');
    rates.className = 'genre-rates';
    rates.textContent = '理解度 ' + topic.mastery_pct + '%';
    head.append(name, rates);

    row.append(head, genreBar(topic), genreNumbers(topic));

    const mistakes = state.genreMistakes && state.genreMistakes.by_node
      ? Number(state.genreMistakes.by_node[topic.node_id] || 0)
      : null;
    if (mistakes !== null) {
      const line = document.createElement('div');
      line.className = 'genre-numbers genre-mistakes';
      line.textContent = 'これまでに間違えた問題: ' + mistakes + '問';
      row.appendChild(line);
    }
    return row;
  }

  /*
   * 帯グラフ。総問題数を1本の帯にして「最新正解 / 最新誤答 / 未回答」で割る。
   * 0件の区画は要素ごと出さない（幅0の線が残らないようにする）。
   */
  function genreBar(counts) {
    const bar = document.createElement('div');
    bar.className = 'genre-bar';
    const total = Number(counts.total) || 0;
    if (!total) return bar;

    [['correct', counts.latest_correct], ['wrong', counts.latest_wrong],
     ['unanswered', counts.unanswered]].forEach(pair => {
      const value = Number(pair[1]) || 0;
      if (value <= 0) return;
      const seg = document.createElement('div');
      seg.className = 'genre-seg ' + pair[0];
      seg.style.width = (value / total * 100) + '%';
      bar.appendChild(seg);
    });
    return bar;
  }

  function genreNumbers(counts) {
    const div = document.createElement('div');
    div.className = 'genre-numbers';
    div.innerHTML = '全<b>' + counts.total + '</b>問中　'
      + '回答済み<b>' + counts.answered + '</b>問（' + counts.answered_pct + '%）'
      + '／未回答<b>' + counts.unanswered + '</b>問　'
      + '正解<b>' + counts.latest_correct + '</b>・誤答<b>' + counts.latest_wrong + '</b>'
      + '（正答率' + counts.correct_pct + '%）';
    return div;
  }

  /** ジャンル配下の論点ぶんを足す。読み込み前は null（行ごと出さない）。 */
  function genreEverWrong(genre) {
    if (!state.genreMistakes || !state.genreMistakes.by_node) return null;
    return (genre.topics || []).reduce(
      (sum, t) => sum + Number(state.genreMistakes.by_node[t.node_id] || 0), 0
    );
  }

  const MODES = ['learning', 'review', 'unanswered'];

  function startLearning(mode) {
    state.mode = MODES.indexOf(mode) >= 0 ? mode : 'learning';
    state.excludeQuestionIds = [];
    state.failedQuestions.clear();
    clearPrefetch();
    showQuestionView();
    loadNextQuestion();
  }

  function showHome() {
    clearPrefetch();
    state.current = null;
    $('questionView').classList.add('hidden');
    $('genreView').classList.add('hidden');
    $('homeView').classList.remove('hidden');
    loadHomeData();
  }

  function showQuestionView() {
    $('homeView').classList.add('hidden');
    $('genreView').classList.add('hidden');
    $('questionView').classList.remove('hidden');
  }

  function setQuestionLoading(message) {
    showQuestionPanel(true, '問題を準備しています', message || '安全に表示できるか確認中です。');
  }

  // 待っていても状況が変わらないとき（未回答が0件など）に出す固定メッセージ。
  function showQuestionNotice(title, message) {
    showQuestionPanel(false, title, message);
  }

  function showQuestionPanel(busy, title, message) {
    $('questionCard').classList.add('hidden');
    $('resultCard').classList.add('hidden');
    $('questionLoading').classList.remove('hidden');
    $('loadingSpinner').classList.toggle('hidden', !busy);
    $('noticeHomeBtn').classList.toggle('hidden', busy);
    $('loadingTitle').textContent = title;
    $('loadingMessage').textContent = message;
  }

  function loadNextQuestion() {
    const seq = ++state.presentSeq;
    state.current = null;
    state.selectedAnswer = '';
    state.attemptId = '';
    resetAiExplanation();

    // 解説を読んでいるあいだに用意できていれば、待たずにそのまま表示する。
    // 画像問題は先読みの段階で preloadBundle を通っているので、
    // 「画像の読み込み成功を確認してから表示する」順序は変わらない。
    const ready = takePrefetchedQuestion();
    if (ready) {
      renderQuestion(ready.question, ready.bundle, seq);
      return;
    }

    setQuestionLoading('問題を選んでいます。');

    google.script.run
      .withSuccessHandler(q => {
        if (seq !== state.presentSeq) return;
        if (!q || !q.ok) {
          // 未回答モードで残り0件のときは、回答済み問題へ勝手に戻さない。
          if (q && q.reason === 'ALL_QUESTIONS_ANSWERED') {
            showQuestionNotice(
              '未回答の正式問題はすべて解答済みです',
              q.message || '弱点モードや復習モードで、解いた問題の定着を確認できます。'
            );
            return;
          }
          showQuestionNotice(
            'いま出せる問題がありません',
            (q && q.message) || '現在の条件に合う問題が見つかりませんでした。'
          );
          showToast('出題できる問題が見つかりませんでした。');
          return;
        }
        presentQuestion(q, seq);
      })
      .withFailureHandler(err => {
        if (seq !== state.presentSeq) return;
        showServerError(err);
      })
      .getNextQuestion({
        mode: state.mode,
        excludeQuestionIds: state.excludeQuestionIds
      });
  }

  function presentQuestion(q, seq) {
    if (!q.image_required) {
      renderQuestion(q, { question_images: [], option_images: {} }, seq);
      return;
    }

    // 重要: 画像問題は、この時点では問題文も選択肢も画面へ出さない。
    setQuestionLoading('画像を取得し、実際に表示できるか確認しています。');

    google.script.run
      .withSuccessHandler(bundle => {
        if (seq !== state.presentSeq) return;
        if (!bundle || !bundle.ok) {
          rejectImageQuestion(q, 'SERVER_IMAGE_BUNDLE_FAILED');
          return;
        }
        preloadBundle(bundle)
          .then(() => {
            if (seq !== state.presentSeq) return;
            renderQuestion(q, bundle, seq);
          })
          .catch(() => rejectImageQuestion(q, 'BROWSER_IMAGE_PRELOAD_FAILED'));
      })
      .withFailureHandler(() => {
        if (seq !== state.presentSeq) return;
        rejectImageQuestion(q, 'SERVER_CALL_FAILED');
      })
      .getQuestionImageBundle(q.question_id);
  }

  function preloadBundle(bundle) {
    const urls = [];
    (bundle.question_images || []).forEach(x => urls.push(x.data_url));
    Object.keys(bundle.option_images || {}).forEach(letter => {
      (bundle.option_images[letter] || []).forEach(x => urls.push(x.data_url));
    });

    return Promise.all(urls.map(src => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        if (img.naturalWidth > 0 && img.naturalHeight > 0) resolve();
        else reject(new Error('zero size image'));
      };
      img.onerror = reject;
      img.src = src;
    })));
  }

  function rejectImageQuestion(q, reason) {
    if (!q || !q.question_id) return;
    if (state.failedQuestions.has(q.question_id)) return;
    state.failedQuestions.add(q.question_id);
    rememberExcluded(q.question_id);

    // 回答ボタンを出さず、別問題へ移動する。
    setQuestionLoading('画像を確認できなかったため、この問題はスキップしました。');
    google.script.run.reportImageLoadFailure(q.question_id, reason);
    window.setTimeout(loadNextQuestion, 350);
  }

  function renderQuestion(q, bundle, seq) {
    if (seq !== state.presentSeq) return;

    state.current = q;
    state.selectedAnswer = '';
    state.startedAt = Date.now();

    $('questionLoading').classList.add('hidden');
    $('resultCard').classList.add('hidden');
    $('questionCard').classList.remove('hidden');

    $('topicBadge').textContent = q.topic || q.primary_node_id || '論点';
    $('masteryBadge').textContent = '理解度 ' + String(q.mastery_pct || 0) + '%';
    $('questionText').textContent = q.question_text || '';

    renderQuestionImages(q, bundle.question_images || []);
    renderOptions(q, bundle.option_images || {});

    document.querySelectorAll('input[name="confidence"]').forEach(x => { x.checked = false; });
    $('submitBtn').disabled = true;
  }

  function renderQuestionImages(q, images) {
    const area = $('questionImages');
    area.innerHTML = '';
    images.forEach((x, idx) => {
      const img = document.createElement('img');
      img.className = 'question-image';
      img.alt = '問題画像 ' + (idx + 1);
      img.src = x.data_url;
      img.addEventListener('click', () => openLightbox(x.data_url, '問題画像 ' + (idx + 1)));
      img.addEventListener('error', () => rejectRenderedImage(q, 'QUESTION_IMAGE_RENDER_ERROR'));
      area.appendChild(img);
    });
  }

  /*
    03_問題台帳には「[Aの画像選択肢]」のような内部用の目印が入っている行がある。
    これは画面へ出す文章ではないので、その選択肢の画像が実際に表示できたときだけ隠す。
    画像が無いのに文字だけ隠すと「何を選ぶのか分からないまま回答できる」状態になるため、
    その場合は隠さず、問題ごとスキップする。
  */
  const OPTION_IMAGE_PLACEHOLDER =
    /^[\[［(（]?\s*(?:選択肢)?\s*[A-Ha-h]?\s*の?\s*(?:画像選択肢|選択肢画像|画像)\s*[A-Ha-h]?\s*[\]］)）]?$/;

  function isOptionImagePlaceholder(text) {
    const value = String(text == null ? '' : text).trim();
    if (!value) return false;
    return OPTION_IMAGE_PLACEHOLDER.test(value);
  }

  function renderOptions(q, optionImages) {
    const area = $('optionsArea');
    area.innerHTML = '';

    const letters = Object.keys(q.options || {}).sort();

    for (const letter of letters) {
      // 選択肢画像は、必ずその文字（A/B/C/D）をキーにして取り出す。
      // 表示順から推測しないことで、A画像がBへ付くような取り違えを防ぐ。
      const imgs = optionImages[letter] || [];
      const rawText = q.options[letter] || '';
      const placeholder = isOptionImagePlaceholder(rawText);

      if (placeholder && !imgs.length) {
        // 画像前提の選択肢なのに画像が無い。回答させずにこの問題を止める。
        rejectRenderedImage(q, 'OPTION_IMAGE_MISSING:' + letter);
        return;
      }

      const row = document.createElement('div');
      row.className = 'option-row';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'answer-btn';
      button.dataset.option = letter;

      const badge = document.createElement('span');
      badge.className = 'answer-letter';
      badge.textContent = letter;

      const body = document.createElement('span');
      body.className = 'option-body';

      const text = document.createElement('span');
      text.className = 'option-text';
      text.textContent = placeholder ? '' : rawText;
      body.appendChild(text);

      imgs.forEach((x, idx) => {
        const img = document.createElement('img');
        img.className = 'option-image';
        img.alt = '選択肢 ' + letter + ' の画像 ' + (idx + 1);
        img.src = x.data_url;
        img.addEventListener('error', () => rejectRenderedImage(q, 'OPTION_IMAGE_RENDER_ERROR:' + letter));
        // 画像はボタンの中にあるので、画像をタップしてもこの選択肢が選ばれる。
        body.appendChild(img);
      });

      button.append(badge, body);
      button.addEventListener('click', () => selectAnswer(letter));
      row.appendChild(button);

      if (imgs.length) {
        // 拡大はボタンの外に置く。拡大しただけでA/B/C/Dが選ばれてはいけない。
        const zoom = document.createElement('button');
        zoom.type = 'button';
        zoom.className = 'zoom-btn';
        zoom.textContent = '拡大';
        zoom.setAttribute('aria-label', '選択肢 ' + letter + ' の画像を拡大（回答は選ばれません）');
        zoom.addEventListener('click', e => {
          e.stopPropagation();
          e.preventDefault();
          openLightbox(imgs[0].data_url, '選択肢 ' + letter + ' の画像');
        });
        row.appendChild(zoom);
      }

      area.appendChild(row);
    }
  }

  function rejectRenderedImage(q, reason) {
    // DOM挿入後の読み込み失敗も「画像なしで回答させない」。
    $('submitBtn').disabled = true;
    rejectImageQuestion(q, reason);
  }

  function selectAnswer(letter) {
    state.selectedAnswer = letter;
    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.option === letter);
    });
    updateSubmitState();
  }

  function updateSubmitState() {
    if (!state.current) {
      $('submitBtn').disabled = true;
      return;
    }
    const conf = getConfidence();
    $('submitBtn').disabled = !(state.selectedAnswer && conf);
  }

  function getConfidence() {
    const checked = document.querySelector('input[name="confidence"]:checked');
    return checked ? Number(checked.value) : 0;
  }

  function submitCurrentAnswer() {
    if (!state.current || !state.selectedAnswer || !getConfidence()) return;

    const q = state.current;
    const responseSeconds = Math.max(0, Math.round((Date.now() - state.startedAt) / 1000));
    $('submitBtn').disabled = true;
    setQuestionLoading('回答を記録し、新しい理解度を再計算しています。');

    google.script.run
      .withSuccessHandler(result => {
        if (!result || !result.ok) {
          showToast('回答を記録できませんでした。');
          return;
        }
        rememberExcluded(q.question_id);
        // サーバー側はここでジャンル別のキャッシュを捨てている。
        // 画面が持っている集計も一緒に捨てないと、古い数字が残る。
        forgetGenreData();
        renderResult(result);
      })
      .withFailureHandler(showServerError)
      .submitAnswer({
        questionId: q.question_id,
        userAnswer: state.selectedAnswer,
        confidence: getConfidence(),
        responseSeconds,
        mode: state.mode,
        sessionId: state.sessionId
      });
  }

  function renderResult(r) {
    // この下で state.current を消すので、先に「解き直しかどうか」を控えておく。
    // 判定できないときは解き直し扱いにして、先読みを走らせない。
    const previouslyAnswered = state.current
      ? state.current.previously_answered === true
      : true;

    // AI補助解説は、この attempt_id が実在する回答にだけ紐づく。
    state.attemptId = String(r.attempt_id || '');
    resetAiExplanation();

    $('questionLoading').classList.add('hidden');
    $('questionCard').classList.add('hidden');
    $('resultCard').classList.remove('hidden');

    const good = !!r.is_correct;
    $('resultMark').textContent = good ? '○' : '×';
    $('resultMark').className = 'result-mark ' + (good ? 'good' : 'bad');
    $('resultTitle').textContent = good ? '正解です' : '不正解です';
    $('resultTitle').className = good ? 'good' : 'bad';

    $('answerSummary').textContent =
      'あなたの回答: ' + r.user_answer + ' ／ 正解: ' + r.correct_answer;

    $('masteryChange').textContent =
      '理解度: ' + r.mastery_before + '% → ' + r.mastery_after + '%' +
      (r.next_review_at ? '　次回復習: ' + r.next_review_at : '');

    const parts = [];
    if (r.explanation_plain) parts.push(r.explanation_plain);
    if (r.explanation_formal) parts.push(r.explanation_formal);
    if (r.explanation_calculation) parts.push(r.explanation_calculation);
    if (r.explanation_options) parts.push(r.explanation_options);
    $('explanationBox').textContent = parts.length
      ? parts.join('\n\n')
      : '解説データは未登録です。正誤と理解度は正常に記録されています。';
    renderMathIn($('explanationBox'));

    // 次の問題の選択時は、回答した直後の同じ問題を避ける。
    state.current = null;

    // 解説を読んでいるあいだに、次の1問を裏で用意しておく。
    prefetchNextQuestion();

    // 同じあいだに、AI解説も裏で作り始めておく（条件を満たすときだけ）。
    if (shouldPrefetchAi(r, previouslyAnswered)) {
      startAiPrefetch(state.attemptId);
    }
  }

  /* ------------------------- 次の問題の先読み -------------------------
   *
   * 目的は待ち時間を隠すことだけで、採点・理解度・学習ログには一切関わらない。
   * 呼ぶのは読み取り専用の getNextQuestion / getQuestionImageBundle だけ。
   *
   * 用意したものは「そのときの条件（モードと除外リスト）」に紐づけて持つ。
   * 条件が変わっていたら使わずに捨て、ふつうに取り直す。
   * 画像問題は先読みの時点で preloadBundle を通し、
   * 成功したものだけを手元に残す（表示できない画像の問題を先読みで出さない）。
   */
  function prefetchKey() {
    return state.mode + '|' + state.excludeQuestionIds.join(',');
  }

  function clearPrefetch() {
    state.prefetch = null;
    state.prefetchKey = '';
  }

  function takePrefetchedQuestion() {
    const ready = state.prefetch;
    if (!ready) return null;
    clearPrefetch();
    if (ready.key !== prefetchKey()) return null;
    if (state.failedQuestions.has(String(ready.question.question_id))) return null;
    return ready;
  }

  function prefetchNextQuestion() {
    const key = prefetchKey();
    if (state.prefetchKey === key) return;

    state.prefetch = null;
    state.prefetchKey = key;

    // 先読みが失敗しても画面には出さない。次に押されたとき通常どおり取りに行く。
    const giveUp = () => { if (state.prefetchKey === key) clearPrefetch(); };
    const keep = (question, bundle) => {
      if (state.prefetchKey !== key) return;
      state.prefetch = { key: key, question: question, bundle: bundle };
    };

    google.script.run
      .withSuccessHandler(q => {
        if (state.prefetchKey !== key) return;
        if (!q || !q.ok) { giveUp(); return; }
        if (!q.image_required) {
          keep(q, { question_images: [], option_images: {} });
          return;
        }

        google.script.run
          .withSuccessHandler(bundle => {
            if (state.prefetchKey !== key) return;
            if (!bundle || !bundle.ok) { giveUp(); return; }
            preloadBundle(bundle)
              .then(() => keep(q, bundle))
              .catch(giveUp);
          })
          .withFailureHandler(giveUp)
          .getQuestionImageBundle(q.question_id);
      })
      .withFailureHandler(giveUp)
      .getNextQuestion({
        mode: state.mode,
        excludeQuestionIds: state.excludeQuestionIds.slice()
      });
  }

  /**
   * \( ... \) と \[ ... \] を数式として組版する。
   * KaTeXを読み込めなかった場合は何もしない（LaTeXは文字として残るが、
   * 解説には記号の意味が日本語で書かれているので読み進められる）。
   * $ は金額と紛らわしいので区切りに使わない。
   */
  function renderMathIn(el) {
    if (!el || typeof renderMathInElement !== 'function') return;
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    } catch (e) {
      // 数式にできなくても、解説の文章はそのまま読める状態を保つ。
    }
  }

  function resetAiExplanation() {
    state.aiSeq += 1;
    // 前の問題ぶんの先読み結果を持ち越さない。
    clearAiPrefetch();

    const box = $('aiExplanationBox');
    box.textContent = '';
    box.classList.add('hidden');

    const status = $('aiStatus');
    status.textContent = '';
    status.classList.add('hidden');

    const btn = $('aiExplainBtn');
    btn.textContent = 'AIでさらに噛み砕く';
    btn.disabled = !state.attemptId;
  }

  // AIはこのボタンを押したときだけ呼ぶ（毎問自動では呼ばない）。
  /* ------------------ AI補助解説（先読みつき・表示だけ） ------------------
   *
   * 生成には数秒かかる。結果画面を読んでいるあいだに裏で作り始めておくと、
   * 押したときには出来ていることが多い。
   *
   * 先読みするのは次の2つを両方満たすときだけ。
   *   1. 登録解説（explanation_*）が1つも無い
   *      ＝AI解説がその問題の唯一の解説になるので、押される見込みが高い
   *   2. その問題に正式回答したことがない（2回目以降は先読みしない）
   *      ＝解き直しでは以前の解説がシートに残っている見込みがあり、
   *        押されないまま生成してAPIを使うのを避ける
   *
   * 採点・理解度・学習ログには一切関わらない（読むだけの呼び出し）。
   */
  function shouldPrefetchAi(result, previouslyAnswered) {
    if (!state.attemptId) return false;
    // 2回目以降の問題では先読みしない。
    // 分からないときも「先読みしない」側へ倒す（押されない生成を増やさない）。
    if (previouslyAnswered !== false) return false;
    return !hasRegisteredExplanation(result);
  }

  function hasRegisteredExplanation(r) {
    return ['explanation_plain', 'explanation_formal',
            'explanation_calculation', 'explanation_options']
      .some(key => String((r && r[key]) || '').trim());
  }

  function clearAiPrefetch() {
    state.aiPrefetch = null;
    state.aiWanted = false;
    state.aiShownAttemptId = '';
  }

  function startAiPrefetch(attemptId) {
    state.aiPrefetch = { attemptId: attemptId, status: 'loading', result: null };

    google.script.run
      .withSuccessHandler(res => {
        const slot = state.aiPrefetch;
        if (!slot || slot.attemptId !== attemptId) return;
        slot.status = (res && res.ok) ? 'done' : 'failed';
        slot.result = res;
        // 出来上がる前に押されていたら、そのまま画面へ出す。
        if (state.aiWanted) {
          state.aiWanted = false;
          if (slot.status === 'done') showAiExplanation(res);
          else requestAiExplanation(false);
        }
      })
      .withFailureHandler(() => {
        const slot = state.aiPrefetch;
        if (!slot || slot.attemptId !== attemptId) return;
        slot.status = 'failed';
        // 先読みが失敗しただけなら黙って捨て、押されたときに作り直す。
        if (state.aiWanted) {
          state.aiWanted = false;
          requestAiExplanation(false);
        }
      })
      .getAiExplanation({ attemptId: attemptId });
  }

  function requestAiExplanation(force) {
    if (!state.attemptId) {
      showToast('回答が記録された問題にだけAI解説を出せます。');
      return;
    }

    // すでに解説を出したあとの「もう一度作る」は、残っているものを使わず作り直す。
    const regenerate = force === true;

    const slot = state.aiPrefetch;
    if (!regenerate && slot && slot.attemptId === state.attemptId) {
      if (slot.status === 'done') {
        showAiExplanation(slot.result);
        return;
      }
      if (slot.status === 'loading') {
        // 先読みが走っている最中。二重に生成させず、出来上がりを待つ。
        state.aiWanted = true;
        setAiWaiting();
        return;
      }
    }

    const seq = ++state.aiSeq;
    setAiWaiting();

    google.script.run
      .withSuccessHandler(res => {
        if (seq !== state.aiSeq) return;
        showAiExplanation(res);
      })
      .withFailureHandler(err => {
        if (seq !== state.aiSeq) return;
        $('aiExplainBtn').disabled = false;
        $('aiStatus').textContent = (err && err.message)
          ? err.message
          : 'AI補助解説を取得できませんでした。採点と理解度の記録は正常です。';
      })
      .getAiExplanation({ attemptId: state.attemptId, force: regenerate });
  }

  function setAiWaiting() {
    const status = $('aiStatus');
    $('aiExplainBtn').disabled = true;
    status.textContent = 'AIが補助解説を作っています。少しお待ちください。';
    status.classList.remove('hidden');
  }

  function showAiExplanation(res) {
    const btn = $('aiExplainBtn');
    const status = $('aiStatus');
    btn.disabled = false;

    if (!res || !res.ok) {
      status.textContent = (res && res.message)
        ? res.message
        : 'AI補助解説を取得できませんでした。採点と理解度の記録は正常です。';
      return;
    }

    status.textContent = 'モデル: ' + (res.model || '') +
      aiSourceLabel(res) +
      (res.truncated
        ? '　※解説が長くなりすぎて途中で切れています。「AI解説をもう一度作る」でやり直せます。'
        : '');
    const box = $('aiExplanationBox');
    box.textContent = res.text || '';
    renderMathIn(box);
    box.classList.remove('hidden');
    btn.textContent = 'AI解説をもう一度作る';
    // これ以降の「もう一度作る」は、残っているものを使わず作り直す。
    state.aiShownAttemptId = String(res.attempt_id || state.attemptId || '');
  }

  // どこから出てきた解説かを正直に書く。押すたび作り直していると誤解させない。
  function aiSourceLabel(res) {
    if (!res.cached) return '';
    if (res.source === 'sheet') {
      return res.generated_at
        ? '（' + res.generated_at + ' に作成した解説を再表示）'
        : '（保存済みの解説を再表示）';
    }
    return '（1時間以内に作成済みの結果を再表示）';
  }

  function rememberExcluded(qid) {
    if (!qid) return;
    state.excludeQuestionIds.push(qid);
    if (state.excludeQuestionIds.length > 30) {
      state.excludeQuestionIds = state.excludeQuestionIds.slice(-30);
    }
  }

  function openLightbox(src, label) {
    const img = $('lightboxImage');
    img.src = src;
    img.alt = label || '拡大画像';
    $('lightbox').classList.remove('hidden');
    // 開いた直後は必ず「全体が見える」状態から始める。
    setLightboxZoom(false);
  }

  function closeLightbox() {
    setLightboxZoom(false);
    $('lightbox').classList.add('hidden');
    $('lightboxImage').removeAttribute('src');
  }

  function toggleLightboxZoom() {
    setLightboxZoom(!state.lightboxZoomed);
  }

  /**
   * false: 画面内へ縮小して画像全体を見せる（既定）
   * true : 原寸のまま表示し、はみ出す分はスクロールで確認する
   * どちらの場合も画像を切り落とさない。
   */
  function setLightboxZoom(zoomed) {
    state.lightboxZoomed = !!zoomed;
    const box = $('lightbox');
    box.classList.toggle('zoomed', state.lightboxZoomed);
    $('lightboxZoomBtn').textContent = state.lightboxZoomed ? '全体を表示' : '原寸で見る';
    if (!state.lightboxZoomed) {
      box.scrollTop = 0;
      box.scrollLeft = 0;
    }
  }

  function showToast(message) {
    const toast = $('toast');
    toast.textContent = message;
    toast.classList.remove('hidden');
    window.setTimeout(() => toast.classList.add('hidden'), 2600);
  }

  function showServerError(err) {
    const msg = err && err.message ? err.message : String(err || '不明なエラー');
    setQuestionLoading('処理中にエラーが発生しました。');
    showToast(msg);
  }
})();
</script>

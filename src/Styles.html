<style>
:root {
  color-scheme: light;
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #667085;
  --line: #dfe4ee;
  --accent: #2457d6;
  --accent-soft: #eaf0ff;
  --good: #157347;
  --bad: #b42318;
  --shadow: 0 10px 30px rgba(23, 32, 51, .08);

  /*
    拡大表示で画像に許す最大サイズ。
    親要素の幅に対する % ではなく画面サイズから直接引いて決める。
    （flexの中で % を使うと、はみ出したまま縮まないブラウザ挙動があるため）
  */
  --lightbox-bar: 60px;
  --lightbox-max-w: calc(
    100vw - 32px
    - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)
  );
  --lightbox-max-h: calc(
    100vh - var(--lightbox-bar) - 16px
    - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)
  );
}
/* iPhoneのアドレスバー伸縮で100vhが実画面より大きくなるため、使える環境ではdvhを優先する。 */
@supports (height: 100dvh) {
  :root {
    --lightbox-max-w: calc(
      100dvw - 32px
      - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)
    );
    --lightbox-max-h: calc(
      100dvh - var(--lightbox-bar) - 16px
      - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)
    );
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  line-height: 1.65;
}
button, input { font: inherit; }
button { touch-action: manipulation; }
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px max(16px, env(safe-area-inset-left));
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.app-header h1 { margin: 0; font-size: 20px; }
.eyebrow { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
.app-shell { width: min(100%, 920px); margin: 0 auto; padding: 18px 14px 60px; }
.hidden { display: none !important; }
.panel, .hero-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
}
.hero-card {
  padding: 22px;
  display: grid;
  gap: 12px;
  margin-bottom: 16px;
}
.hero-card h2 { margin: 3px 0 4px; font-size: 22px; }
.primary-btn, .secondary-btn, .ghost-btn, .zoom-btn {
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid transparent;
  padding: 10px 16px;
  font-weight: 800;
  cursor: pointer;
}
.primary-btn { background: var(--accent); color: #fff; }
.primary-btn:disabled { opacity: .45; cursor: not-allowed; }
.secondary-btn { background: #fff; color: var(--accent); border-color: #b7c7f5; }
.ghost-btn { min-height: 42px; background: transparent; border-color: var(--line); color: var(--text); }
.big { width: 100%; }
.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.metric {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.metric-label { color: var(--muted); font-size: 13px; }
.metric-value { font-size: 24px; font-weight: 900; margin-top: 2px; }
.panel { padding: 18px; margin-bottom: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { margin: 0 0 10px; font-size: 19px; }
.muted { color: var(--muted); }
.weakness-list { display: grid; gap: 10px; }
.weakness-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.weakness-item:first-child { border-top: 0; }
.weakness-name { font-weight: 800; }
.progress-track { grid-column: 1 / -1; height: 8px; background: #edf0f5; border-radius: 999px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: inherit; }
.centered { text-align: center; padding: 34px 18px; }
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 4px solid #e3e8f4; border-top-color: var(--accent);
  margin: 0 auto 12px;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.question-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.badge {
  display: inline-flex; align-items: center; min-height: 30px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--accent-soft); color: #1844aa; font-size: 13px; font-weight: 800;
}
.badge.subtle { background: #f0f2f5; color: #475467; }
.question-text { white-space: pre-wrap; font-size: 20px; line-height: 1.65; margin: 0 0 16px; }
.question-images { display: grid; gap: 10px; margin: 12px 0 18px; }
/*
  通常表示の問題画像。
  ・カード幅より大きい画像は縮めて全体を見せる（max-width: 100%）
  ・小さい画像を引き伸ばさない（width: auto。width:100% にすると拡大されてぼやける）
  ・縦横比は常に維持する（height: auto + object-fit: contain）
*/
.question-image {
  display: block; width: auto; height: auto;
  max-width: 100%; max-height: 70vh; object-fit: contain;
  margin: 0 auto; border-radius: 12px; border: 1px solid var(--line);
  cursor: zoom-in;
}
.options-area { display: grid; gap: 12px; margin: 16px 0 20px; }
.option-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
.answer-btn {
  width: 100%; min-height: 58px; text-align: left;
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start;
  padding: 13px; border: 2px solid var(--line); border-radius: 14px;
  background: #fff; color: var(--text); cursor: pointer;
}
.answer-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.answer-letter {
  display: inline-grid; place-items: center; width: 30px; height: 30px;
  border-radius: 8px; background: #f0f2f5; font-weight: 900;
}
.option-body { min-width: 0; }
.option-text { white-space: pre-wrap; }
.option-text:empty { display: none; }
/* 選択肢画像も引き伸ばさず、選択肢の枠内に全体が収まるようにする。 */
.option-image {
  display: block; width: auto; height: auto; max-width: 100%; max-height: 52vh;
  object-fit: contain; margin-top: 8px; border-radius: 10px;
}
.zoom-btn {
  min-width: 58px; min-height: 58px;
  background: #fff; border-color: var(--line); color: var(--accent);
  padding: 6px 8px;
}
.hint { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.confidence-box { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 12px; }
.confidence-title { font-weight: 800; margin-bottom: 8px; }
.confidence-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.confidence-options label {
  min-height: 48px; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer;
}
.result-mark { font-size: 42px; font-weight: 900; }
.result-mark.good, #resultTitle.good { color: var(--good); }
.result-mark.bad, #resultTitle.bad { color: var(--bad); }
.answer-summary, .mastery-change, .explanation-box {
  border-radius: 12px; padding: 14px; margin: 12px 0;
  background: #f8fafc; border: 1px solid var(--line);
}
.mastery-change { font-weight: 900; font-size: 18px; }
.result-actions { display: grid; gap: 10px; margin-top: 18px; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 100; width: min(92vw, 560px); padding: 12px 16px;
  color: #fff; background: #172033; border-radius: 12px; box-shadow: var(--shadow);
}
/*
  画像の拡大表示。
  見切れの原因は「上下のバー分の余白を引かずに max-height を決める」ことなので、
  余白（バーの高さ + iPhoneのsafe-area）を calc で引いた高さを上限にする。
  overflow:hidden で切り落とさず、はみ出す場合はこの枠の中をスクロールさせる。
  中央寄せは margin:auto で行う（place-items:center は、はみ出したとき上端が切れる）。
*/
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.92);
  display: flex;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding:
    calc(var(--lightbox-bar) + env(safe-area-inset-top, 0px))
    max(12px, env(safe-area-inset-right, 0px))
    max(16px, env(safe-area-inset-bottom, 0px))
    max(12px, env(safe-area-inset-left, 0px));
}
/* min-width: 0 が無いと、flexの中で画像が縮まずに右端がはみ出す。 */
.lightbox-stage { margin: auto; min-width: 0; max-width: 100%; }
/* 既定は「画面内へ縮小して全体を見せる」。縦横比は維持し、引き伸ばさない。 */
.lightbox-image {
  display: block;
  width: auto; height: auto;
  max-width: var(--lightbox-max-w);
  max-height: var(--lightbox-max-h);
  object-fit: contain;
}
/* 「原寸で見る」に切り替えたときだけ、原寸のままスクロールで端まで確認できる。 */
.lightbox.zoomed .lightbox-stage { margin: 0; max-width: none; }
.lightbox.zoomed .lightbox-image { max-width: none; max-height: none; }
.lightbox-bar {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  right: max(10px, env(safe-area-inset-right, 0px));
  left: max(10px, env(safe-area-inset-left, 0px));
  z-index: 1;
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 8px 0;
}
.lightbox-btn {
  min-width: 48px; min-height: 44px; border: 0; border-radius: 10px;
  padding: 8px 14px; background: #fff; color: #111; font-weight: 800;
  cursor: pointer;
}
.ai-panel {
  margin-top: 18px; padding: 14px;
  border: 1px dashed var(--line); border-radius: 12px; background: #fcfdff;
}
.ai-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ai-title { margin: 0; font-size: 16px; }
.ai-note { margin: 6px 0 12px; font-size: 13px; color: var(--muted); }
.ai-status { margin: 10px 0 0; font-size: 13px; }
/*
  解説は長さが決まらない。高さを固定すると必ずどこかで見切れるので、
  高さは中身に任せ、横に長い語（URLや長いLaTeXの残骸）だけを折り返す。
*/
.ai-explanation-box, .explanation-box {
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
  max-height: none; overflow: visible;
}
.ai-explanation-box {
  margin-top: 10px; padding: 14px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
}

/* 長い数式はスマホ幅からはみ出すので、その式の中だけ横スクロールさせる。 */
.katex-display {
  overflow-x: auto; overflow-y: hidden;
  padding-bottom: 4px; margin: 8px 0;
}

@media (max-width: 640px) {
  .app-shell { padding: 12px 10px 48px; }
  .panel, .hero-card { border-radius: 14px; padding: 15px; }
  .question-text { font-size: 18px; }
  .question-image { max-height: 64vh; }
  .option-image { max-height: 46vh; }
  .confidence-options { grid-template-columns: 1fr; }
  .metric-value { font-size: 21px; }
}
</style>
